[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
via_ir = true
optimizer_runs = 200
# out/: deployCode reads artifacts. deployments/: DeployLocal.s.sol writes addresses.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "permit2/=lib/permit2/",
    "forge-std/=lib/forge-std/src/",
]

# Same settings as Remix's defaults (optimizer 200, no via-IR), deployables only:
#   FOUNDRY_PROFILE=remix forge build --sizes
[profile.remix]
via_ir = false
skip = ["test/**", "script/**"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
